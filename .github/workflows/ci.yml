name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      # PKCS#11 contra SoftHSM2 (HSM em software). O caminho do módulo
      # varia por distribuição — descobrir e exportar SOFTHSM_LIB.
      - name: Instalar SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2
          lib="$(dpkg -L libsofthsm2 | grep -m1 'libsofthsm2\.so$')"
          test -n "$lib" || { echo "libsofthsm2.so não encontrado" >&2; exit 1; }
          echo "SOFTHSM_LIB=$lib" >> "$GITHUB_ENV"

      - name: Verificar build e qualidade
        run: dotnet test HubSaude.Cliente.sln --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tests/**/TestResults/coverage.cobertura.xml
          if-no-files-found: ignore
