name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore HubSaude.Cliente.sln

      - name: Compilar
        run: dotnet build HubSaude.Cliente.sln --configuration Release --no-restore

      - name: Testes com cobertura
        run: dotnet test HubSaude.Cliente.sln --configuration Release --no-build --verbosity normal

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
